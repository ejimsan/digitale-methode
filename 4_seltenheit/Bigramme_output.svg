<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
<style>text { font-family: sans-serif; fill: #222; } .title { font-size: 20px; font-weight: bold; } .label { font-size: 13px; } .value { font-size: 12px; } .axis { stroke: #222; stroke-width: 1; } .bar { fill: #4c78a8; }</style>
<title>Bigramm-Häufigkeit für ina und ina</title>
<desc>Die Balken zeigen absolute Häufigkeit in Zeilen; die relative Seltenheit ist der negative Logarithmus der relativen Häufigkeit.</desc>
<text x="90" y="30" class="title">Bigramm: ina + ina</text>
<text x="90" y="55" class="label">Gemeinsame Nennung in einer Manuskriptzeile</text>
<text x="90" y="73" class="label">Wert: absolute Häufigkeit (relative Seltenheit)</text>
<line x1="90" y1="90" x2="90" y2="395" class="axis"/>
<line x1="90" y1="395" x2="760" y2="395" class="axis"/>
<text x="400.0" y="462" text-anchor="middle" class="label">Eingabetext</text>
<text x="20" y="242.5" text-anchor="middle" transform="rotate(-90 20 242.5)" class="label">Absolute Bigramm-Häufigkeit (Zeilen)</text>
<rect x="224.0" y="90" width="134.0" height="305" class="bar"/>
<text x="291.0" y="82" text-anchor="middle" class="value">63 (relative Seltenheit: 2.252)</text>
<text x="291.0" y="417" text-anchor="middle" class="label">I.5 Erra and Išum</text>
<rect x="492.0" y="235" width="134.0" height="160" class="bar"/>
<text x="559.0" y="227" text-anchor="middle" class="value">33 (relative Seltenheit: 3.197)</text>
<text x="559.0" y="417" text-anchor="middle" class="label">II.1 The Babylonian Theodicy</text>
</svg>
